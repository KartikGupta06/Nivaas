name: nivaas_mobile
description: "Nivaas - Accessible, Mobile-First Society Management System for Indian Housing Societies."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1          # Explicit, type-safe reactive state management

  # Declarative Routing
  go_router: ^14.8.0                # URL-aware, role-based declarative routing

  # Networking
  dio: ^5.8.0+1                     # Powerful HTTP client with interceptors & cancel tokens

  # On-Device Offline Database
  isar: ^3.1.0+1                    # Fast, type-safe offline NoSQL/relational database
  isar_flutter_libs: ^3.1.0+1       # Native Isar binaries for Android & iOS

  # Secure & Key-Value Storage
  flutter_secure_storage: ^9.2.4    # EncryptedSharedPreferences (Android) / Keychain (iOS)
  shared_preferences: ^2.5.2        # Simple non-sensitive app settings

  # Network Monitoring
  connectivity_plus: ^6.1.3         # Real-time cellular/Wi-Fi connection monitoring

  # Logging & Utilities
  logger: ^2.5.0                    # Structured, extensible console logging
  permission_handler: ^11.4.0       # Cross-platform permission requests (Camera, Storage, SMS)
  intl: ^0.20.2                     # Date formatting & internationalization base
  equatable: ^2.0.7                 # Value equality for state comparison

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/illustrations/
    - assets/icons/
    - assets/animations/
    - assets/documents/
